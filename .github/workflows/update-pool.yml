name: Mise a jour Hatch NHL Super Pool

on:
  schedule:
    # 3:00 AM heure de New York = 08:00 UTC (EDT) / 07:00 UTC (EST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de lancer la mise à jour manuellement sur GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécuter le script de mise à jour
        run: python scripts/update_data.py

      - name: Publier les modifications dans le dépôt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Mise à jour automatique des points de la LNH" || exit 0
          git push
