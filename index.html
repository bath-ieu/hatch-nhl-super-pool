<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatch NHL Super Pool 2026-2027</title>
    <style>
        :root {
            --border-color: #34495e;
            --accent-red: #e0564c;
            --text-dark: #2c3e50;
            --bg-page: #0f172a;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-page); 
            color: #f8fafc; 
            margin: 0; 
            padding: 15px; 
        }

        .container { 
            width: 100%; 
            max-width: 1100px; 
            margin: 0 auto; 
            box-sizing: border-box;
        }

        h1 { 
            text-align: center; 
            color: #38bdf8; 
            font-size: clamp(1.5rem, 4vw, 2.2rem); 
            margin-bottom: 25px; 
        }

        /* --- STYLES DES PASTILLES (INSPIRÉS DE L'IMAGE) --- */
        .participant-card {
            margin-bottom: 20px;
            width: 100%;
        }

        .pill-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            cursor: pointer;
        }

        /* Cercle de rang à gauche */
        .rank-circle {
            width: clamp(50px, 8vw, 75px);
            height: clamp(50px, 8vw, 75px);
            min-width: clamp(50px, 8vw, 75px);
            border-radius: 50%;
            background-color: #ffffff;
            border: 4px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            font-weight: 800;
            color: var(--accent-red);
            box-sizing: border-box;
        }

        /* Pastille principale */
        .main-pill {
            flex-grow: 1;
            background-color: #ffffff;
            border: 4px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 12px 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            min-height: clamp(65px, 9vw, 85px);
        }

        .participant-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .participant-name {
            font-size: clamp(1.1rem, 2.8vw, 1.8rem);
            font-weight: 600;
            color: var(--accent-red);
            margin-bottom: 2px;
            line-height: 1.1;
        }

        /* Section division des points */
        .points-breakdown {
            display: flex;
            gap: clamp(10px, 2.5vw, 25px);
        }

        .breakdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .breakdown-label {
            font-size: clamp(0.7rem, 1.4vw, 0.95rem);
            color: var(--border-color);
            font-weight: 500;
        }

        .breakdown-value {
            font-size: clamp(0.75rem, 1.5vw, 1rem);
            color: var(--accent-red);
            font-weight: 700;
        }

        /* Cercle TOTAL à droite */
        .total-circle {
            width: clamp(55px, 8.5vw, 75px);
            height: clamp(55px, 8.5vw, 75px);
            min-width: clamp(55px, 8.5vw, 75px);
            border-radius: 50%;
            border: 3px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            box-sizing: border-box;
            margin-left: 10px;
        }

        .total-label {
            font-size: clamp(0.55rem, 1.1vw, 0.75rem);
            color: var(--text-dark);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .total-points {
            font-size: clamp(0.85rem, 1.8vw, 1.25rem);
            font-weight: 800;
            color: var(--accent-red);
            line-height: 1;
        }

        /* --- SECTION DÉTAILS DÉROULANTE --- */
        .details {
            display: none;
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            margin-top: 10px;
            border: 1px solid #334155;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; margin-bottom: 12px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        .section-title { font-weight: 700; color: #38bdf8; margin-top: 14px; font-size: 0.95rem; text-transform: uppercase; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #334155; color: #cbd5e1; }

        @media (max-width: 480px) {
            .main-pill { padding: 6px 8px 6px 12px; }
            .pill-wrapper { gap: 6px; }
            .total-circle { margin-left: 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏒 Hatch NHL Super Pool (2026-2027)</h1>
        <div id="leaderboard">Chargement du classement...</div>
    </div>

    <script>
        async function loadPoolData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                const data = await res.json();
                const container = document.getElementById('leaderboard');
                container.innerHTML = '';

                data.leaderboard.forEach((p, index) => {
                    const card = document.createElement('div');
                    card.className = 'participant-card';
                    
                    let skatersHtml = p.skaters.map(s => {
                        // Forcer 'A' pour tous les attaquants
                        const displayPos = (s.position === 'D') ? 'D' : 'A';
                        return `<tr>
                            <td><b>${s.name}</b> <span class="badge">${displayPos}</span></td>
                            <td>${s.goals || 0} B, ${s.assists || 0} P</td>
                            <td><b>${s.points || 0} pts</b></td>
                        </tr>`;
                    }).join('');

                    let goaliesHtml = p.goalies.map(g => 
                        `<tr>
                            <td><b>${g.name}</b> <span class="badge">G</span></td>
                            <td>${g.wins || 0} V, ${g.shutouts || 0} BL, ${g.otLosses || 0} DP</td>
                            <td><b>${g.points || 0} pts</b></td>
                        </tr>`
                    ).join('');

                    let teamsHtml = p.teams.map(t => 
                        `<tr>
                            <td><b>${t.name}</b> (${t.abbrev || ''})</td>
                            <td>${t.reg_wins || 0} VR, ${t.ot_wins || 0} VP, ${t.ot_losses || 0} DP</td>
                            <td><b>${t.points || 0} pts</b></td>
                        </tr>`
                    ).join('');

                    card.innerHTML = `
                        <div class="pill-wrapper" onclick="toggleDetails(${index})">
                            <div class="rank-circle">${index + 1}</div>
                            <div class="main-pill">
                                <div class="participant-info">
                                    <div class="participant-name">${p.name}</div>
                                    <div class="points-breakdown">
                                        <div class="breakdown-item">
                                            <span class="breakdown-label">Att</span>
                                            <span class="breakdown-value">${p.att_pts || 0}</span>
                                        </div>
                                        <div class="breakdown-item">
                                            <span class="breakdown-label">Def</span>
                                            <span class="breakdown-value">${p.def_pts || 0}</span>
                                        </div>
                                        <div class="breakdown-item">
                                            <span class="breakdown-label">Goaler</span>
                                            <span class="breakdown-value">${p.goalie_pts || 0}</span>
                                        </div>
                                        <div class="breakdown-item">
                                            <span class="breakdown-label">Equipe</span>
                                            <span class="breakdown-value">${p.team_pts || 0}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="total-circle">
                                    <span class="total-label">TOTAL</span>
                                    <span class="total-points">${p.total_points || 0} pts</span>
                                </div>
                            </div>
                        </div>

                        <div class="details" id="details-${index}">
                            <div class="section-title">Attaquants & Défenseurs</div>
                            <table>
                                <thead><tr><th>Joueur</th><th>Statistiques</th><th>Points</th></tr></thead>
                                <tbody>${skatersHtml}</tbody>
                            </table>

                            <div class="section-title">Gardiens</div>
                            <table>
                                <thead><tr><th>Gardien</th><th>Statistiques</th><th>Points</th></tr></thead>
                                <tbody>${goaliesHtml}</tbody>
                            </table>

                            <div class="section-title">Équipes</div>
                            <table>
                                <thead><tr><th>Équipe</th><th>Statistiques</th><th>Points</th></tr></thead>
                                <tbody>${teamsHtml}</tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('leaderboard').innerHTML = "<p style='text-align:center; color:#ef4444;'>Erreur lors du chargement des données.</p>";
            }
        }

        function toggleDetails(index) {
            const el = document.getElementById(`details-${index}`);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        loadPoolData();
    </script>
</body>
</html>
