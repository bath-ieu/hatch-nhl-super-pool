<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatch NHL Super Pool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; font-size: 2.5rem; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .participant-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .rank { font-weight: bold; font-size: 1.4rem; color: #f59e0b; width: 40px; }
        .name { font-size: 1.2rem; flex-grow: 1; font-weight: 600; }
        .score { font-size: 1.5rem; font-weight: bold; color: #4ade80; }
        .details { display: none; margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { text-align: left; padding: 6px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }
        .section-title { font-weight: bold; color: #38bdf8; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏒 Hatch NHL Super Pool</h1>
        <div id="leaderboard">Chargement du classement...</div>
    </div>

    <script>
        async function loadPoolData() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();
                const container = document.getElementById('leaderboard');
                container.innerHTML = '';

                data.leaderboard.forEach((p, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let skatersHtml = p.skaters.map(s => `<tr><td>${s.name} (${s.position})</td><td>${s.goals}B, ${s.assists}P</td><td><b>${s.points} pts</b></td></tr>`).join('');
                    let goaliesHtml = p.goalies.map(g => `<tr><td>${g.name}</td><td>${g.wins}V, ${g.shutouts}BL, ${g.otLosses}DP</td><td><b>${g.points} pts</b></td></tr>`).join('');
                    let teamsHtml = p.teams.map(t => `<tr><td>${t.name}</td><td>${t.reg_wins}VR, ${t.ot_wins}VP, ${t.ot_losses}DP</td><td><b>${t.points} pts</b></td></tr>`).join('');

                    card.innerHTML = `
                        <div class="participant-header" onclick="toggleDetails(${index})">
                            <span class="rank">#${index + 1}</span>
                            <span class="name">${p.name}</span>
                            <span class="score">${p.total_points} PTS</span>
                        </div>
                        <div class="details" id="details-${index}">
                            <div class="section-title">Attaquants & Défenseurs</div>
                            <table><tr><th>Joueur</th><th>Stats</th><th>Pts</th></tr>${skatersHtml}</table>
                            <div class="section-title">Gardiens</div>
                            <table><tr><th>Gardien</th><th>Stats</th><th>Pts</th></tr>${goaliesHtml}</table>
                            <div class="section-title">Équipes</div>
                            <table><tr><th>Équipe</th><th>Stats</th><th>Pts</th></tr>${teamsHtml}</table>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('leaderboard').innerHTML = "Erreur lors du chargement des données.";
            }
        }

        function toggleDetails(index) {
            const el = document.getElementById(`details-${index}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        loadPoolData();
    </script>
</body>
</html>
