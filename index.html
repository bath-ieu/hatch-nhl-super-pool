<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatch NHL Super Pool 2026-2027</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; font-size: 2.2rem; margin-bottom: 25px; }
        .card { background: #1e293b; border-radius: 12px; padding: 18px; margin-bottom: 15px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .participant-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .rank { font-weight: bold; font-size: 1.3rem; color: #f59e0b; width: 45px; }
        .name { font-size: 1.2rem; flex-grow: 1; font-weight: 600; color: #f8fafc; }
        .score { font-size: 1.4rem; font-weight: 800; color: #4ade80; background: #064e3b; padding: 4px 12px; border-radius: 8px; }
        .details { display: none; margin-top: 15px; border-top: 1px solid #334155; padding-top: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; margin-bottom: 12px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        .section-title { font-weight: 700; color: #38bdf8; margin-top: 14px; font-size: 0.95rem; text-transform: uppercase; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #334155; color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏒 Hatch NHL Super Pool (2026-2027)</h1>
        <div id="leaderboard">Chargement du classement en cours...</div>
    </div>

    <script>
        async function loadPoolData() {
            try {
                // Anti-cache pour assurer la lecture immédiate du data.json mis à jour
                const res = await fetch('data.json?t=' + new Date().getTime());
                const data = await res.json();
                const container = document.getElementById('leaderboard');
                container.innerHTML = '';

                data.leaderboard.forEach((p, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let skatersHtml = p.skaters.map(s => 
                        `<tr>
                            <td><b>${s.name}</b> <span class="badge">${s.position}</span></td>
                            <td>${s.goals || 0} B, ${s.assists || 0} P</td>
                            <td><b>${s.points || 0} pts</b></td>
                        </tr>`
                    ).join('');

                    let goaliesHtml = p.goalies.map(g => 
                        `<tr>
                            <td><b>${g.name}</b></td>
                            <td>${g.wins || 0} V, ${g.shutouts || 0} BL, ${g.otLosses || 0} DP</td>
                            <td><b>${g.points || 0} pts</b></td>
                        </tr>`
                    ).join('');

                    let teamsHtml = p.teams.map(t => 
                        `<tr>
                            <td><b>${t.name}</b> (${t.abbrev || ''})</td>
                            <td>${t.reg_wins || 0} VR, ${t.ot_wins || 0} VP, ${t.ot_losses || 0} DP</td>
                            <td><b>${t.points || 0} pts</b></td>
                        </tr>`
                    ).join('');

                    card.innerHTML = `
                        <div class="participant-header" onclick="toggleDetails(${index})">
                            <span class="rank">#${index + 1}</span>
                            <span class="name">${p.name}</span>
                            <span class="score">${p.total_points || 0} PTS</span>
                        </div>
                        <div class="details" id="details-${index}">
                            <div class="section-title">Attaquants & Défenseurs</div>
                            <table>
                                <thead><tr><th>Joueur</th><th>Statistiques</th><th>Points</th></tr></thead>
                                <tbody>${skatersHtml}</tbody>
                            </table>

                            <div class="section-title">Gardiens</div>
                            <table>
                                <thead><tr><th>Gardien</th><th>Statistiques</th><th>Points</th></tr></thead>
                                <tbody>${goaliesHtml}</tbody>
                            </table>

                            <div class="section-title">Équipes</div>
                            <table>
                                <thead><tr><th>Équipe</th><th>Statistiques</th><th>Points</th></tr></thead>
                                <tbody>${teamsHtml}</tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('leaderboard').innerHTML = "<p style='text-align:center; color:#ef4444;'>Erreur lors du chargement des données. Assurez-vous que data.json est bien généré.</p>";
            }
        }

        function toggleDetails(index) {
            const el = document.getElementById(`details-${index}`);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        loadPoolData();
    </script>
</body>
</html>
